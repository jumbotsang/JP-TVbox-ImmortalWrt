name: Build JP-TVbox ImmortalWrt
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: ImmortalWrt source branch
        required: true
        default: v25.12.2
        type: string
permissions:
  contents: write
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ inputs.source_branch }}
  CONFIG_FILE: JP-TVbox/.config
  DIY_SH: JP-TVbox/diy.sh
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - name: Initialize build environment
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev \
            libtool lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf \
            python3 python3-setuptools python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
      - name: Clone ImmortalWrt source
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
      - name: Update feeds and add required packages
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          chmod +x "$GITHUB_WORKSPACE/$DIY_SH"
          "$GITHUB_WORKSPACE/$DIY_SH"
      - name: Load firmware configuration
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" "$GITHUB_WORKSPACE/openwrt/.config"
      - name: Compile firmware
        working-directory: openwrt
        run: |
          make defconfig
          make download -j8
          find dl -size -1024c -delete
          make -j"$(nproc)" || make -j1 V=s
      - name: Package JP-TVbox image with Flippy 6.18.y kernel
        if: ${{ success() && !cancelled() }}
        uses: unifreq/openwrt_packit@master
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/*-armsr-armv8-generic-rootfs.tar.gz
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: 6.18.y
          KERNEL_AUTO_LATEST: true
          PACKAGE_SOC: diy
          SCRIPT_DIY_PATH: JP-TVbox/mk_rk3566_jp-tvbox.sh
          WHOAMI: Jumbotsang
          SW_FLOWOFFLOAD: 0
          HW_FLOWOFFLOAD: 0
          SFE_FLOW: 1
      - name: Publish firmware release
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: JP-TVbox_${{ github.run_number }}_${{ github.run_attempt }}
          name: JP-TVbox ImmortalWrt ${{ env.PACKAGED_OUTPUTDATE }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*
          body: |
            RK3566 JP-TVbox ImmortalWrt firmware.
            Kernel series: Flippy 6.18.y (latest available patch release).
            Built from ${{ env.REPO_URL }} branch ${{ env.REPO_BRANCH }}.
